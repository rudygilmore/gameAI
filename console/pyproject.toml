# console/pyproject.toml
# Single source of dependency declarations for the Universal Retro-DQN console
# project (per the Decision Log entry of 2026-05-15 in
# EXECPLAN_UNIVERSAL_RETRO_DQN.md). No requirements.txt is shipped; if a lock
# file is later required for clean-machine reproducibility, add one alongside
# this file but keep this file as the declared source of truth.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-retro-dqn"
version = "0.1.0"
description = "Modular DQN framework on PyTorch and stable-retro, configured per run via TOML."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gameAI/console contributors" }]

# Versions are pinned to those verified on the reference machine
# (Apple Silicon macOS, miniforge env `retro_env`, Python 3.10.20). Bump only
# after re-verification on that environment.
dependencies = [
    "torch>=2.5.1",
    "stable-retro>=1.0.0",
    "gymnasium>=1.0.0",
    "numpy>=1.26.4,<2.0",
    "opencv-python>=4.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
universal-retro-dqn = "main:main"

[tool.setuptools]
# `src/` is a regular Python package, not a `src-layout`. Keep `main.py` as a
# top-level CLI module discoverable when running `python main.py …` from
# `console/`.
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "configs*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
