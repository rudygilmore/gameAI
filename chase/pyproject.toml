[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chase-game"
version = "0.1.0"
description = "Chase grid-world Gymnasium environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# DQN training, observation wrapper (torchvision resize), and eval
rl = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["env*"]
